<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none">
  <rect width="800" height="600" fill="#0f172a"/>
  <defs>
    <pattern id="grid-hk" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <linearGradient id="grad-hackathon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#grid-hk)"/>
  <rect width="800" height="600" fill="url(#grad-hackathon)"/>
  <rect x="40" y="40" width="720" height="520" rx="16" stroke="#334155" stroke-width="2" stroke-dasharray="6 6"/>
  
  <!-- Icon: Terminal / Hackathon -->
  <g transform="translate(360, 200)">
    <circle cx="40" cy="40" r="48" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <path d="M25 40 L35 48 L25 56" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <line x1="40" y1="56" x2="55" y2="56" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
