<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>E-Cell Dashboard</title>
<link rel="icon" href="img/logo-black.svg">
<link rel="icon" href="img/logo-black.svg" media="(prefers-color-scheme: light)">
<link rel="icon" href="img/logo-white.png" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..900&family=Big+Shoulders+Display:wght@700..900&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Silkscreen:wght@400;700&display=swap">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/roles.css">
<script>(function(){try{var t=localStorage.getItem("ecell-theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);}catch(_){}})();</script>
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html" aria-label="E-Cell SMVIT home">
      <img class="brand__logo brand__logo--dark" src="img/logo-white.png" alt="" width="425" height="410">
      <img class="brand__logo brand__logo--light" src="img/logo-black.svg" alt="" width="426" height="381">
      <span>E-CELL SMVIT</span>
    </a>
    <nav class="nav" aria-label="Account">
      <a href="index.html">Home</a>
      <button class="btn" type="button" id="logout-top" style="padding:0.65em 1em;font-size:0.9rem">Log out</button>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle theme" title="Toggle light/dark theme">
        <svg class="theme-toggle__icon theme-toggle__icon--light" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="theme-toggle__icon theme-toggle__icon--dark" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </nav>
  </div>
</header>

<main id="main" class="wrap">
  <p class="loading" id="loading">Checking your session…</p>

  <div class="dash" id="dash" hidden>
    <div class="dash__hello">
      <span class="label">Dashboard</span>
      <h1 id="hello">Welcome.</h1>
      <p id="hello-sub">You're signed in.</p>
    </div>

    <div class="dash__grid">
      <section class="pass" aria-label="Member pass">
        <div class="pass__top">
          <span class="pass__brand">
            <img class="brand__logo brand__logo--dark" src="img/logo-white.png" alt="" width="425" height="410">
            <span>E-Cell SMVIT</span>
          </span>
          <span>Member pass</span>
        </div>
        <div class="pass__name" id="pass-name">Member</div>
        <dl>
          <div><dt>Member ID</dt><dd id="pass-id">—</dd></div>
          <div><dt>Status</dt><dd>Active</dd></div>
          <div><dt>Role</dt><dd id="pass-role">—</dd></div>
          <div><dt>Member since</dt><dd id="pass-since">—</dd></div>
          <div><dt>USN</dt><dd id="pass-usn">—</dd></div>
        </dl>
      </section>

      <section class="panel" id="founder-panel" aria-labelledby="check-title">
        <div class="panel__head">
          <h2 id="check-title">Founder checklist</h2>
          <span class="label" id="check-count">0 / 5</span>
        </div>
        <div class="progress" aria-hidden="true"><span id="check-bar" style="width:0%"></span></div>
        <ul class="checklist" id="checklist"></ul>
        <p class="note" id="team-note">A Head will add you to your team.</p>
      </section>
    </div>

    <div id="role-dashboard"></div>

    <div class="dash__actions">
      <a class="btn btn--primary" href="index.html#programs">Browse programs <span class="arrow" aria-hidden="true">→</span></a>
      <button class="btn" type="button" id="logout">Log out</button>
    </div>
  </div>
</main>

<script src="js/vendor/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/theme.js"></script>
<script src="js/roles.js"></script>
<script src="js/dash-views.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
