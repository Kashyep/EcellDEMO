  <text x="400" y="360" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">Workshops &amp; Labs</text>
  <text x="400" y="400" text-anchor="middle" font-family="'IBM Plex Mono', monospace, monospace" font-size="15" fill="#94a3b8">public/img/gallery/workshop.svg</text>
  
