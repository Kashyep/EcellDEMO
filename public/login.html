<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Log in to E-Cell SMVIT</title>
<link rel="icon" href="img/logo-black.svg">
<link rel="icon" href="img/logo-black.svg" media="(prefers-color-scheme: light)">
<link rel="icon" href="img/logo-white.png" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..900&family=Big+Shoulders+Display:wght@700..900&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Silkscreen:wght@400;700&display=swap">
<link rel="stylesheet" href="css/styles.css">
<script>(function(){try{var t=localStorage.getItem("ecell-theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);}catch(_){}})();</script>
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html" aria-label="E-Cell SMVIT home">
      <img class="brand__logo brand__logo--dark" src="img/logo-white.png" alt="" width="425" height="410">
      <img class="brand__logo brand__logo--light" src="img/logo-black.svg" alt="" width="426" height="381">
      <span>E-CELL SMVIT</span>
    </a>
    <nav class="nav" aria-label="Main">
      <a class="btn btn--primary" href="signup.html">Join E-Cell</a>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle theme" title="Toggle light/dark theme">
        <svg class="theme-toggle__icon theme-toggle__icon--light" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="theme-toggle__icon theme-toggle__icon--dark" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </nav>
  </div>
</header>

<main class="auth" id="main">
  <aside class="auth__side">
    <div class="auth__side-brand">
      <a class="brand" href="index.html" aria-label="E-Cell SMVIT home">
        <img class="brand__logo brand__logo--dark" src="img/logo-white.png" alt="" width="425" height="410">
        <span>E-CELL SMVIT</span>
      </a>
    </div>
    <span class="label">Members</span>
    <h2>Welcome back, builder.</h2>
    <ol>
      <li>Open your member pass</li>
      <li>Pick up your founder checklist</li>
      <li>Head to the next ideathon</li>
    </ol>
  </aside>

  <div class="auth__main">
    <div class="form-card">
      <div class="brand">
        <img class="brand__logo brand__logo--dark" src="img/logo-white.png" alt="" width="425" height="410">
        <img class="brand__logo brand__logo--light" src="img/logo-black.svg" alt="" width="426" height="381">
        <span>E-CELL SMVIT</span>
      </div>
      <div style="display:grid;gap:8px">
        <span class="label">Log in</span>
        <h1>Log in</h1>
        <p class="sub">Use the email you signed up with.</p>
      </div>

      <div class="alert" id="form-alert" role="alert" hidden></div>

      <form class="form" id="login-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" inputmode="email" required aria-describedby="email-error">
          <span class="field__error" id="email-error"></span>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input id="password" name="password" type="password" class="has-toggle" autocomplete="current-password" required aria-describedby="password-error">
            <button class="toggle-pw" type="button" data-toggle="password" aria-label="Show password">Show</button>
          </div>
          <span class="field__error" id="password-error"></span>
        </div>
        <button class="btn btn--primary btn--block" type="submit" id="submit">Log in <span class="arrow" aria-hidden="true">→</span></button>
      </form>

      <p class="switch">New here? <a href="signup.html">Create an account</a></p>
    </div>
  </div>
</main>

<script src="js/vendor/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/theme.js"></script>
<script src="js/auth-page.js"></script>
</body>
</html>
