<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none">
  <rect width="800" height="600" fill="#0f172a"/>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <linearGradient id="grad-ideathon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#grid)"/>
  <rect width="800" height="600" fill="url(#grad-ideathon)"/>
  <rect x="40" y="40" width="720" height="520" rx="16" stroke="#334155" stroke-width="2" stroke-dasharray="6 6"/>
  
  <!-- Icon: Lightbulb / Thesis -->
  <g transform="translate(360, 200)">
    <circle cx="40" cy="40" r="48" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <path d="M40 22 C29 22 20 31 20 42 C20 50 25 56 28 61 L52 61 C55 56 60 50 60 42 C60 31 51 22 40 22 Z" stroke="#38bdf8" stroke-width="2.5" fill="none"/>
    <line x1="32" y1="67" x2="48" y2="67" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="35" y1="73" x2="45" y2="73" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
